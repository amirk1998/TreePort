name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-clippy:
    name: fmt + clippy (lint gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # پین‌شده به همون نسخه‌ای که در rust-toolchain.toml هست — اگر
      # یک‌روز خواستی نسخه رو ارتقا بدی، هر دو جا رو با هم عوض کن.
      - name: Install Rust (1.90.0)
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-and-test:
    name: build + test (${{ matrix.os }})
    needs: fmt-and-clippy
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.90.0)
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Build (debug)
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Build (release, sanity check)
        run: cargo build --release --verbose

      - name: Smoke test the binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/treeport.exe --help
            ./target/release/treeport.exe . -q
          else
            ./target/release/treeport --help
            ./target/release/treeport . -q
          fi

  clippy-latest-stable-watch:
    name: clippy on latest stable (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
