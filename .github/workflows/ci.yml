name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-clippy:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build-and-test:
    name: Build + test (${{ matrix.os }})
    needs: fmt-and-clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build debug
        run: cargo build --locked --verbose

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Build release
        run: cargo build --locked --release --verbose

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ runner.os }}" = "Windows" ]; then
            ./target/release/treeport.exe --help
            ./target/release/treeport.exe . --quiet --no-progress
          else
            ./target/release/treeport --help
            ./target/release/treeport . --quiet --no-progress
          fi

  stable-watch:
    name: Latest stable advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Clippy on latest stable
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
