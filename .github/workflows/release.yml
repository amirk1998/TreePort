name: Release

# Fires when you push a tag matching v*.*.* (e.g. v0.2.0).
# Cross-compiles Treeport for Linux (x86_64, aarch64), macOS (x86_64,
# aarch64), and Windows (x86_64), packages each as .tar.gz/.zip, and
# publishes them all to a new GitHub Release for that tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0) — for manual re-runs"
        required: true

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: treeport

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            linker_pkg: gcc-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker_bin: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-14
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (1.90.0)
        uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Only the aarch64 Linux job needs an extra cross-linker; the
      # macOS runners can already target both Apple architectures, and
      # the other jobs build natively.
      - name: Install cross-linker (aarch64-unknown-linux-gnu only)
        if: matrix.linker_pkg
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker_pkg }}
          echo "${{ matrix.linker_env }}=${{ matrix.linker_bin }}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          stage="${BIN_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$stage/"
          [ -f README.md ] && cp README.md "$stage/"
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "$stage/"
          [ -f LICENSE ] && cp LICENSE "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          echo "ASSET=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $stage = "${env:BIN_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:BIN_NAME}.exe" -Destination $stage
          if (Test-Path README.md)     { Copy-Item README.md -Destination $stage }
          if (Test-Path CHANGELOG.md)  { Copy-Item CHANGELOG.md -Destination $stage }
          if (Test-Path LICENSE)       { Copy-Item LICENSE -Destination $stage }
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=$stage.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Treeport ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
