name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for manual re-runs, e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: treeport

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Verify Cargo version matches tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          expected="v${version}"

          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match Cargo.toml version ${version}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            linker_pkg: gcc-aarch64-linux-gnu
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker_bin: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-14
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.linker_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker_pkg }}
          echo "${{ matrix.linker_env }}=${{ matrix.linker_bin }}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix artifact
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail

          stage="${BIN_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"

          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$stage/"
          cp README.md "$stage/"
          cp CHANGELOG.md "$stage/"

          if [ -f LICENSE ]; then
            cp LICENSE "$stage/"
          fi

          tar -czf "${stage}.tar.gz" "$stage"
          echo "ASSET=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Package Windows artifact
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $stage = "${env:BIN_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null

          Copy-Item "target\${{ matrix.target }}\release\${env:BIN_NAME}.exe" -Destination $stage
          Copy-Item "README.md" -Destination $stage
          Copy-Item "CHANGELOG.md" -Destination $stage

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" -Destination $stage
          }

          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lah dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Treeport ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
