[package]
name = "treeport"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, zero-dependency directory & file intelligence CLI with full Unicode and right-to-left script support."
license = "MIT"
repository = "https://github.com/amirk1998/treeport"
readme = "README.md"
keywords = ["cli", "filesystem", "directory", "file-analysis", "unicode"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "treeport"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
