[package]
name = "treeport"
version = "0.1.0"
edition = "2021"
description = "A fast, zero-dependency directory & file intelligence tool for the command line — with full Unicode / right-to-left script support (Persian, Arabic, Hebrew, …) built in."
license = "MIT"
repository = "https://github.com/amirk1998/treeport"
readme = "README.md"
# MSRV: `unsafe extern { ... }` blocks (used for the kernel32 FFI in
# win_console) were stabilized in 1.82.0 (RFC 3484). This is the floor —
# CI/dev actually pin to a newer exact version via rust-toolchain.toml.
rust-version = "1.82"

[[bin]]
name = "treeport"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true